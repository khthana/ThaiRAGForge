# D5: a count/total figure ("N of M") that no report states as a *pair*. The
# check is deliberately strict -- only the same-shape rule discriminates a real
# figure from a one-off one (measured: 64% of real pairs clear against 4-13% of
# perturbed ones; every looser rule clears a wrong number a third to
# three-quarters of the time). The price is that a report stating the same fact
# as a table row, a percentage or two separate figures cannot clear its prose,
# and that is what these entries are. Each names the line that supports it, so
# the entry is a provenance record rather than a silencer: it is keyed on the
# exact string, so changing "0 of 239" to "0 of 241" stops matching and re-flags.
