# D4: an eval input that changed after a report that reads it, cleared because
# the change provably cannot move that report's numbers.
inputs:
  - src: src/rag_lab/retrievers/hybrid.py
    report: hybrid_significance_test_9way.md
    checked: 2026-08-08
    reason: >-
      The 2026-08-08 edit added weighted-RRF `alpha` support. A uniform 0.5x
      factor cannot reorder a ranking, so alpha=0.50 (the shipped default, and
      what this report was computed at) is rank-order-identical to plain RRF --
      pinned as a regression guard by
      tests/retrievers/test_hybrid_retriever.py. The report's numbers are
      therefore unchanged by construction, not merely unaffected in practice.

  - src: src/rag_lab/retrievers/hybrid.py
    report: hybrid_alpha_sweep.md
    checked: 2026-08-09
    reason: >-
      The 2026-08-09 edit added the `fetch_depth` knob. Its default is None,
      which computes `depth = len(index.chunks)` -- literally the k=n expression
      the old code passed -- so the shipped path is unchanged by construction,
      and tests/retrievers/test_hybrid_retriever.py::
      test_fetch_depth_none_is_identical_to_fetching_the_whole_corpus pins it.
      No script outside tools/eval/hybrid_fetch_depth_sweep.py ever sets the
      parameter (grepped 2026-08-09), so no other report can read a truncated
      fusion.

  - src: src/rag_lab/retrievers/hybrid.py
    report: soft_vs_hard_routing.md
    checked: 2026-08-09
    reason: >-
      Same 2026-08-09 `fetch_depth` edit as the entry above; same reason. This
      report re-fuses through HybridRetriever at the default, so it sees the
      k=n path unchanged.

  - src: src/rag_lab/retrievers/hybrid.py
    report: hybrid_fetch_depth_sweep.md
    checked: 2026-08-12
    reason: >-
      The 2026-08-12 edit removed the `method="weighted"` + `fetch_depth` raise
      (and its allow_unmeasured_truncation hatch) after
      tools/eval/hybrid_weighted_fetch_depth.py measured the pair; see that
