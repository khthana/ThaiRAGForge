  snippet: 'รายวิชาที่ ๓

    01416416 INFORMATION SYSTEMS, DATABASES AND APPLICATION 3 (3-0-6)

    PREREQUISITE: NONE


    This course studies basic concepts of information systems and database systems, with emphasis on the
    study of relational database systems. Topics include basic concepts of information systems and database
    systems, types of data models, relational database design, entity-relationship models, normal forms
    of relational databases, and database query languages. Some important non-relational data models and
    database application are also introduced in this course.


