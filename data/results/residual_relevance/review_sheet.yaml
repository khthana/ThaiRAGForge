  snippet: 'ศิลปะและการออกแบบ

    ครั้งที่ ๘/๒๕๖๔ เมื่อวันที่ ๑๑ สิงหาคม ๒๕๖๔

    มติที่ประชุม เห็นชอบ

    - คณะกรรมการพัฒนาหลักสูตร เมื่อวันที่ ๑๕ กรกฎาคม ๒๕๖๕

    ข้อสรุปการพิจารณาหลักสูตร ให้ผ่านโดยมีการแก้ไขก่อนนำเสนอสภาสถาบัน


    การพิจารณา

    - คณะอนุกรรมการกลั่นกรองหลักสูตร ระดับปริญญาตรี ๘/๒๕๖๔ เมื่อวันที่ ๑๘ สิงหาคม ๒๕๖๔ ได้

    พิจารณาการขอความเห็นชอบหลักสูตรใหม่ ของคณะสถาปัตยกรรม ศิลปะและการออกแบบ ที่ประชุมมีมติ

