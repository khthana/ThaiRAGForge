    ครั้งที่ ๑๒/๒๕๖๖

    เรื่อง ขอความเห็นชอบแต่งตั้งอาจารย์บัณฑิตประจำ และอาจารย์บัณฑิตพิเศษ

    คณะศิลปศาสตร์


    คณะศิลปศาสตร์ ขอแต่งตั้งอาจารย์บัณฑิตพิเศษ จำนวน ๒ ราย


    ผ่านการพิจารณา

    - คณะกรรมการประจำส่วนงานวิชาการ คณะศิลปศาสตร์ ครั้งที่ ๑๑/๒๕๖๖

    เมื่อวันที่ ๙ พฤศจิกายน ๒๕๖๖

    - คณะอนุกรรมการกลั่นกรองระดับปริญญาตรี และระดับบัณฑิตศึกษา ครั้งที่ ๑๒/๒๕๖๖

    เมื่อวันที่ ๑๓ ธันวาคม ๒๕๖๖ ที่ประชุมมีมติ เห็นชอบ และให้เสนอคณะกรรมการสภาวิชาการ

    ที่ประชุมคณะกรรมการสภาวิชาการ ได้พิจารณาการเสนอแต่งตั้งอาจารย์บัณฑิตพิเศษ ของ

    คณะศิลปศาสตร์ ประธานในที่ประชุมได้ให้คณะกรรมการฯ แสดงความคิดเห็น โดยไม่มีคณะ'
