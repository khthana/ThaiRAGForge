  snippet: 'มติคณะกรรมการสภาวิชาการ

    ครั้งที่ ๑๑/๒๕๖๘

    เรื่อง ขอความเห็นชอบการประชุมวิชาการ

    คณะบริหารธุรกิจ


    คณะบริหารธุรกิจ มีความประสงค์ขอความเห็นชอบรายชื่อการประชุมวิชาการ จำนวน ๑ รายการ

    ผ่านการพิจารณา

    - คณะกรรมการประจำส่วนงานวิชาการ คณะบริหารธุรกิจ ครั้งที่ ๑๐/๒๕๖๘

    เมื่อวันที่ ๒๙ ตุลาคม ๒๕๖๘

