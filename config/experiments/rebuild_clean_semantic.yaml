# Clean rebuild, batch 4/4 (semantic x 9 embedders) -- see
# rebuild_clean_fixed_size.yaml for the full rationale (same in-place
# combo_id replacement, same canonical embedder params). Run last: semantic
# is by far the slowest chunker (per-sentence internal embedding during
# chunking, on top of the same bulk final-embed step every chunker pays --
# see project_corpus_discovery_contamination_bug memory, 1h17m for a single
# semantic+bge-m3 combo on this corpus).
# Run with:
#   PYTHONPATH=src python -m rag_lab.cli run --config config/experiments/rebuild_clean_semantic.yaml
experiment_name: rebuild_clean_semantic

corpus:
  input_dir: academic_resolutions
  subset: full

output_dir: data/index/chunker_compare_full

loaders:
  - type: plain

chunkers:
  - type: semantic
    params: { breakpoint_threshold: 0.5 }

embedders:
  - type: e5
    params: { model_name: "intfloat/multilingual-e5-large" }
  - type: e5
    params: { model_name: "intfloat/multilingual-e5-small" }
  - type: local
    params: { model_name: "BAAI/bge-m3" }
  - type: local
    params: { model_name: "kornwtp/ConGen-BGE_M3-model-phayathaibert" }
  - type: local
    params: { model_name: "kornwtp/SCT-KD-BGE-M3-model-phayathaibert", max_seq_length: 510 }
  - type: qwen3
    params: { model_name: "Qwen/Qwen3-Embedding-4B" }
  - type: qwen3
    params: { model_name: "Qwen/Qwen3-Embedding-0.6B" }
  - type: jina_v5
    params: { model_name: "jinaai/jina-embeddings-v5-text-small-retrieval" }
  - type: local
    params: { model_name: "Thaweewat/jina-embedding-v3-m2v-1024" }

run_mode: cartesian
seed: 42
